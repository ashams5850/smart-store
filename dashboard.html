<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Smart Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .dashboard-container h1 { color: #1a1a2e; font-size: 28px; margin-bottom: 10px; }
        .dashboard-container h1 span { color: #46a0b2; }
        .dashboard-container .user-info { background: #f8f9fa; padding: 12px 20px; border-radius: 12px; margin: 15px 0; font-size: 16px; color: #333; border-right: 5px solid #46a0b2; }
        .dashboard-container .stats { display: flex; gap: 20px; margin: 25px 0; flex-wrap: wrap; }
        .dashboard-container .stat-card { background: #f8f9fa; padding: 15px 25px; border-radius: 12px; flex: 1; min-width: 120px; text-align: center; }
        .dashboard-container .stat-card h3 { margin: 0; font-size: 14px; color: #888; }
        .dashboard-container .stat-card p { margin: 5px 0 0; font-size: 24px; font-weight: bold; color: #1a1a2e; }
        .dashboard-container .btn { display: inline-block; padding: 12px 30px; background: #46a0b2; color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; font-family: 'Tajawal', sans-serif; }
        .dashboard-container .btn:hover { background: #3a8a9a; transform: translateY(-2px); }
        .dashboard-container .btn-logout { background: #dc3545; }
        .dashboard-container .btn-logout:hover { background: #c82333; }
        .dashboard-container .links { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; }
        .visitor-badge { margin-top: 20px; text-align: center; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>👋 مرحباً بك في <span>لوحة التحكم</span></h1>
        <div id="userInfo" class="user-info">📧 جاري تحميل البيانات...</div>

        <div class="stats">
            <div class="stat-card"><h3>👤 المستخدمين المسجلين</h3><p id="userCount">1</p></div>
            <div class="stat-card"><h3>👁️ زوار اليوم</h3><p id="visitorCount">--</p></div>
        </div>

        <div class="links">
            <a href="index.html" class="btn">🏠 العودة للرئيسية</a>
            <a href="products.html" class="btn">🛍️ الباقات</a>
            <button onclick="logoutUser()" class="btn btn-logout">🚪 تسجيل خروج</button>
        </div>

        <div class="visitor-badge">
            👁️ عدد الزوار الكلي:
            <a href="https://visitorbadge.io/status?path=ashams5850.smart-store">
                <img src="https://api.visitorbadge.io/api/visitors?path=ashams5850.smart-store&label=زوار&labelColor=%23697689&countColor=%2346a0b2" />
            </a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqOyFk7cauFKQw6h__E78LkSCiBHkgJSE",
            authDomain: "smart-store-bc1e6.firebaseapp.com",
            projectId: "smart-store-bc1e6",
            storageBucket: "smart-store-bc1e6.firebasestorage.app",
            messagingSenderId: "10224365969",
            appId: "1:10224365969:web:2a2d0de608d0b7d329ea30",
            measurementId: "G-ZW2P5Y8CPE"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const userInfo = document.getElementById('userInfo');

        auth.onAuthStateChanged(user => {
            if (user) {
                const displayName = user.displayName || user.email || 'مستخدم';
                userInfo.innerHTML = `👋 مرحباً <strong>${displayName}</strong>`;
            } else {
                window.location.href = 'login.html';
            }
        });

        function logoutUser() {
            auth.signOut().then(() => {
                alert('✅ تم تسجيل الخروج بنجاح!');
                window.location.href = 'index.html';
            }).catch(err => alert('❌ خطأ: ' + err.message));
        }
    </script>
</body>
</html>
