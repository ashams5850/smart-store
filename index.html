<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDq0yFk7cauFKQw6h_E78LkSC1BhKgJSE",
    authDomain: "smart-store-bc1e6.firebaseapp.com",
    projectId: "smart-store-bc1e6",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function signup() {
    const email = prompt("أدخل بريدك الإلكتروني:");
    const password = prompt("أدخل كلمة المرور (6 أحرف على الأقل):");
    auth.createUserWithEmailAndPassword(email, password)
      .then(() => alert("✅ تم التسجيل بنجاح!"))
      .catch(err => alert("❌ خطأ: " + err.message));
  }

  function login() {
    const email = prompt("أدخل بريدك الإلكتروني:");
    const password = prompt("أدخل كلمة المرور:");
    auth.signInWithEmailAndPassword(email, password)
      .then(() => alert("✅ تم تسجيل الدخول!"))
      .catch(err => alert("❌ خطأ: " + err.message));
  }

  function logout() {
    auth.signOut().then(() => alert("✅ تم تسجيل الخروج!"));
  }
</script>

<div style="text-align:center; margin:20px 0;">
  <button onclick="signup()" style="background:#46a0b2; color:white; padding:10px 25px; border-radius:30px; border:none; margin:5px; font-size:16px; cursor:pointer;">
    📝 تسجيل جديد
  </button>
  <button onclick="login()" style="background:#28a745; color:white; padding:10px 25px; border-radius:30px; border:none; margin:5px; font-size:16px; cursor:pointer;">
    🔐 تسجيل دخول
  </button>
  <button onclick="logout()" style="background:#dc3545; color:white; padding:10px 25px; border-radius:30px; border:none; margin:5px; font-size:16px; cursor:pointer;">
    🚪 تسجيل خروج
  </button>
</div>
