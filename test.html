<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>☕ اختبار القهوة ١</title>
</head>
<body>
    <h1>☕ نموذج اختبار سريع</h1>
    <form id="testForm">
        <label>📧 البريد الإلكتروني</label>
        <input type="email" name="email" placeholder="your@email.com" required>
        <br><br>
        <label>📝 الرسالة</label>
        <input type="text" name="message" placeholder="اكتب أي حاجة" required>
        <br><br>
        <button type="submit">🚀 إرسال</button>
    </form>
    <div id="result" style="margin-top:20px; font-weight:bold;"></div>

    <script>
        // خلي بالك: استخدم الـ ID بتاعك، لو عايز تجرب ب ID جديد غير الرقم ده
        const FORM_ID = 'xeaqlevg'; 

        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة

            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '⏳ جاري الإرسال...';
            resultDiv.style.color = 'orange';

            const formData = new FormData(this);

            try {
                const response = await fetch(`https://formspro.io/f/${FORM_ID}`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    resultDiv.textContent = '✅ تم الإرسال بنجاح! شكراً ☕';
                    resultDiv.style.color = 'green';
                    this.reset(); // مسح الحقول
                } else {
                    throw new Error('فشل الإرسال');
                }
            } catch (error) {
                resultDiv.textContent = '❌ حدث خطأ: ' + error.message;
                resultDiv.style.color = 'red';
                console.error('خطأ:', error);
            }
        });
    </script>
</body>
</html>
