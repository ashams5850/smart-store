<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الملف الشخصي - Smart Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Tajawal', sans-serif;
        }
        .profile-container {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .profile-container h2 { font-size: 28px; color: #1a1a2e; margin-bottom: 10px; }
        .profile-container h2 span { color: #46a0b2; }
        .profile-container .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }
        .profile-container .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #46a0b2;
            background: #e9ecef;
        }
        .profile-container .avatar-wrapper .upload-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #46a0b2;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid white;
            transition: 0.3s;
        }
        .profile-container .avatar-wrapper .upload-btn:hover {
            background: #3a8a9a;
            transform: scale(1.05);
        }
        .profile-container input[type="file"] { display: none; }
        .profile-container .field { text-align: right; margin: 15px 0; }
        .profile-container .field label { display: block; font-weight: 700; font-size: 14px; color: #333; margin-bottom: 5px; }
        .profile-container .field input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
        }
        .profile-container .field input:focus {
            border-color: #46a0b2;
            outline: none;
            box-shadow: 0 0 0 4px rgba(70,160,178,0.1);
        }
        .profile-container .field input:disabled {
            background: #f8f9fa;
            color: #888;
        }
        .profile-container .btn-save {
            width: 100%;
            padding: 14px;
            background: #46a0b2;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .profile-container .btn-save:hover { background: #3a8a9a; transform: scale(1.02); }
        .profile-container .links { margin-top: 20px; }
        .profile-container .links a { color: #46a0b2; text-decoration: none; font-weight: bold; }
        .profile-container .links a:hover { text-decoration: underline; }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            font-weight: bold;
        }
        .toast-success { background: #d4edda; color: #155724; display: block; }
        .toast-error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <div class="profile-container">
        <h2>👤 <span>الملف الشخصي</span></h2>
        <p style="color:#888; margin-bottom:20px;">عدل بياناتك الشخصية</p>

        <div id="toastMessage" class="toast"></div>

        <div class="avatar-wrapper">
            <img id="profileImage" src="https://ui-avatars.com/api/?name=User&background=46a0b2&color=fff&size=128" alt="صورة الملف الشخصي" />
            <label class="upload-btn" for="fileInput">📷</label>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <div class="field">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="displayName" placeholder="أدخل اسمك الكامل" />
        </div>

        <div class="field">
            <label>📧 البريد الإلكتروني</label>
            <input type="email" id="email" disabled />
        </div>

        <button class="btn-save" onclick="updateProfile()">💾 حفظ التغييرات</button>

        <div class="links">
            <a href="dashboard.html">⬅ العودة للوحة التحكم</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDqOyFk7cauFKQw6h__E78LkSCiBHkgJSE",
            authDomain: "smart-store-bc1e6.firebaseapp.com",
            projectId: "smart-store-bc1e6",
            storageBucket: "smart-store-bc1e6.firebasestorage.app",
            messagingSenderId: "10224365969",
            appId: "1:10224365969:web:2a2d0de608d0b7d329ea30",
            measurementId: "G-ZW2P5Y8CPE"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;

        function showToast(msg, type = 'success') {
            const el = document.getElementById('toastMessage');
            el.textContent = msg;
            el.className = 'toast toast-' + type;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        // تحقق من حالة المستخدم
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('displayName').value = user.displayName || '';
                document.getElementById('email').value = user.email || '';
                if (user.photoURL) {
                    document.getElementById('profileImage').src = user.photoURL;
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        // رفع الصورة
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('profileImage').src = event.target.result;
            };
            reader.readAsDataURL(file);

            const storageRef = storage.ref('profile_pics/' + currentUser.uid + '.jpg');
            storageRef.put(file)
                .then(snapshot => snapshot.ref.getDownloadURL())
                .then(url => {
                    return currentUser.updateProfile({ photoURL: url });
                })
                .then(() => {
                    showToast('✅ تم رفع الصورة بنجاح!', 'success');
                })
                .catch(err => {
                    showToast('❌ خطأ في رفع الصورة: ' + err.message, 'error');
                });
        });

        // تحديث الاسم
        function updateProfile() {
            const newName = document.getElementById('displayName').value.trim();
            if (!newName) {
                showToast('❌ الرجاء إدخال اسم صحيح', 'error');
                return;
            }
            currentUser.updateProfile({ displayName: newName })
                .then(() => {
                    showToast('✅ تم تحديث الاسم بنجاح!', 'success');
                })
                .catch(err => {
                    showToast('❌ خطأ: ' + err.message, 'error');
                });
        }
    </script>
</body>
</html>
