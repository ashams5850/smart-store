<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الملف الشخصي - Smart Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }
        .profile-container {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .profile-container h2 { font-size: 28px; color: #1a1a2e; margin-bottom: 10px; }
        .profile-container h2 span { color: #46a0b2; }
        .profile-container .sub { color: #888; margin-bottom: 20px; }
        .profile-container .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }
        .profile-container .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #46a0b2;
            background: #e9ecef;
        }
        .profile-container .avatar-wrapper .upload-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #46a0b2;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid white;
            transition: 0.3s;
        }
        .profile-container .avatar-wrapper .upload-btn:hover { background: #3a8a9a; transform: scale(1.05); }
        .profile-container input[type="file"] { display: none; }
        .profile-container .field { text-align: right; margin: 15px 0; }
        .profile-container .field label { display: block; font-weight: 700; font-size: 14px; color: #333; margin-bottom: 5px; }
        .profile-container .field input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
        }
        .profile-container .field input:focus {
            border-color: #46a0b2;
            outline: none;
            box-shadow: 0 0 0 4px rgba(70,160,178,0.1);
        }
        .profile-container .field input:disabled { background: #f8f9fa; color: #888; }
        .profile-container .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #46a0b2 0%, #2d7d8c 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(70,160,178,0.3);
        }
        .profile-container .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(70,160,178,0.4); }
        .profile-container .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .profile-container .links { margin-top: 20px; }
        .profile-container .links a { color: #46a0b2; text-decoration: none; font-weight: bold; }
        .profile-container .links a:hover { text-decoration: underline; }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
            font-weight: bold;
        }
        .toast-success { background: #d4edda; color: #155724; display: block; }
        .toast-error { background: #f8d7da; color: #721c24; display: block; }
        .toast-loading { background: #fff3cd; color: #856404; display: block; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="profile-container">
        <h2>👤 <span>الملف الشخصي</span></h2>
        <p class="sub">عدل بياناتك الشخصية</p>

        <div id="toastMessage" class="toast"></div>

        <div class="avatar-wrapper">
            <img id="profileImage" src="https://ui-avatars.com/api/?name=User&background=46a0b2&color=fff&size=128" alt="صورة الملف الشخصي" />
            <label class="upload-btn" for="fileInput" id="uploadLabel">📷</label>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <div class="field">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="displayName" placeholder="أدخل اسمك الكامل" />
        </div>

        <div class="field">
            <label>📧 البريد الإلكتروني</label>
            <input type="email" id="email" disabled />
        </div>

        <button class="btn-save" id="saveBtn" onclick="updateProfile()">💾 حفظ التغييرات</button>

        <div class="links">
            <a href="dashboard.html">⬅ العودة للوحة التحكم</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDqOyFk7cauFKQw6h__E78LkSCiBHkgJSE",
            authDomain: "smart-store-bc1e6.firebaseapp.com",
            projectId: "smart-store-bc1e6",
            storageBucket: "smart-store-bc1e6.firebasestorage.app",
            messagingSenderId: "10224365969",
            appId: "1:10224365969:web:2a2d0de608d0b7d329ea30",
            measurementId: "G-ZW2P5Y8CPE"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;

        // دالة عرض الإشعارات
        function showToast(msg, type = 'success') {
            const el = document.getElementById('toastMessage');
            el.textContent = msg;
            el.className = 'toast toast-' + type;
            el.style.display = 'block';
            // إخفاء تلقائي بعد 4 ثواني
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        // دالة تحميل بيانات المستخدم وتحديث الواجهة
        function loadUserData(user) {
            if (!user) return;
            currentUser = user;
            document.getElementById('displayName').value = user.displayName || '';
            document.getElementById('email').value = user.email || '';
            
            // تحديث الصورة (من Firebase)
            if (user.photoURL) {
                document.getElementById('profileImage').src = user.photoURL;
            } else {
                // صورة افتراضية تعتمد على الاسم
                const name = user.displayName || 'User';
                document.getElementById('profileImage').src = 
                    `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=46a0b2&color=fff&size=128`;
            }
        }

        // مراقبة حالة المستخدم
        auth.onAuthStateChanged(user => {
            if (user) {
                loadUserData(user);
            } else {
                window.location.href = 'login.html';
            }
        });

        // 🔥 المشكلة الأساسية هنا كانت: عدم تحديث البيانات بعد رفع الصورة أو تعديل الاسم.
        // ✅ الحل: استخدام user.reload() لجلب أحدث البيانات من الخادم.

        // ========== رفع الصورة ==========
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // التحقق من حجم الصورة (أقل من 5 ميجابايت)
            if (file.size > 5 * 1024 * 1024) {
                showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)', 'error');
                this.value = ''; // إعادة تعيين الحقل
                return;
            }

            // التحقق من نوع الصورة
            if (!file.type.startsWith('image/')) {
                showToast('❌ الرجاء اختيار ملف صورة صحيح (JPG, PNG, GIF)', 'error');
                this.value = '';
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showToast('❌ الرجاء تسجيل الدخول أولاً', 'error');
                return;
            }

            // عرض الصورة مؤقتاً في الواجهة
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('profileImage').src = event.target.result;
            };
            reader.readAsDataURL(file);

            // تعطيل زر رفع الصورة مؤقتاً (منع الضغط المزدوج)
            const label = document.getElementById('uploadLabel');
            label.style.opacity = '0.5';
            label.style.cursor = 'not-allowed';
            showToast('⏳ جاري رفع الصورة...', 'loading');

            try {
                // 1. رفع الملف إلى Firebase Storage
                const storageRef = storage.ref('profile_pics/' + user.uid + '.jpg');
                await storageRef.put(file);

                // 2. الحصول على رابط التحميل
                const downloadURL = await storageRef.getDownloadURL();

                // 3. تحديث حساب المستخدم (photoURL)
                await user.updateProfile({ photoURL: downloadURL });

                // 4. إعادة تحميل بيانات المستخدم من الخادم (هذه أهم خطوة عشان تظهر الصورة فوراً)
                await user.reload();

                // 5. تحديث الواجهة بأحدث البيانات
                const updatedUser = auth.currentUser;
                loadUserData(updatedUser);
                
                showToast('✅ تم تحديث الصورة الشخصية بنجاح!', 'success');
            } catch (error) {
                console.error('خطأ في رفع الصورة:', error);
                showToast('❌ فشل رفع الصورة: ' + error.message, 'error');
                // إعادة الصورة القديمة
                loadUserData(user);
            } finally {
                // إعادة تفعيل زر رفع الصورة
                label.style.opacity = '1';
                label.style.cursor = 'pointer';
                this.value = ''; // تفريغ الحقل
            }
        });

        // ========== تحديث الاسم ==========
        async function updateProfile() {
            const newName = document.getElementById('displayName').value.trim();
            if (!newName) {
                showToast('❌ الرجاء إدخال اسم صحيح', 'error');
                return;
            }

            const user = auth.currentUser;
            if (!user) {
                showToast('❌ الرجاء تسجيل الدخول أولاً', 'error');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الحفظ...';
            
            try {
                await user.updateProfile({ displayName: newName });
                
                // ✅ إعادة تحميل المستخدم لتحديث الجلسة
                await user.reload();

                const updatedUser = auth.currentUser;
                loadUserData(updatedUser);
                
                showToast('✅ تم تحديث الاسم بنجاح!', 'success');
            } catch (error) {
                console.error('خطأ في تحديث الاسم:', error);
                showToast('❌ خطأ: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 حفظ التغييرات';
            }
        }

        // عند تغيير الصورة من مكان آخر (مثلاً من صفحة أخرى)، نقوم بتحديثها عند العودة
        auth.onAuthStateChanged(user => {
            if (user && user.photoURL) {
                // التأكد من أن الصورة في الواجهة محدثة دائماً
                const img = document.getElementById('profileImage');
                if (img.src !== user.photoURL) {
                    img.src = user.photoURL;
                }
            }
        });
    </script>
</body>
</html>
