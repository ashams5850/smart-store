<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - Smart Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1>🛍️ Smart Store</h1>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="products.html">الباقات</a>
                <a href="contact.html">تواصل معنا</a>
            </nav>
        </div>
    </header>

    <section class="contact-page">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info">
                    <h2>📞 تواصل معنا</h2>
                    <p>اختار الباقة المناسبة وهنواصل معك فوراً</p>
                    <div class="info-card">
                        <h4>📱 واتساب</h4>
                        <p><a href="https://wa.me/201012899046">01012899046</a></p>
                        <p><a href="https://wa.me/201126179000">01126179000</a></p>
                    </div>
                    <div class="info-card">
                        <h4>📍 الموقع</h4>
                        <p>الفيوم، مصر</p>
                    </div>
                    <div class="info-card">
                        <h4>🕒 أوقات العمل</h4>
                        <p>السبت - الخميس</p>
                    </div>
                </div>

                <div class="contact-form">
                    <h2>✉️ أرسل رسالة</h2>
                    <form id="contactForm">
                        <input type="text" name="name" placeholder="👤 الاسم" required>
                        <input type="email" name="email" placeholder="📧 البريد الإلكتروني" required>
                        <input type="tel" name="phone" placeholder="📞 رقم الهاتف (اختياري)">
                        <textarea name="message" rows="5" placeholder="📝 الرسالة" required></textarea>
                        <button type="submit">🚀 إرسال</button>
                        <div id="statusMessage" class="message"></div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>Smart Store &copy; 2026 - الفيوم، مصر</p>
        </div>
    </footer>

    <script>
        const FORM_ID = 'xqpkdejk';
        const form = document.getElementById('contactForm');
        const statusMsg = document.getElementById('statusMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الإرسال...';
            statusMsg.className = 'message loading';
            statusMsg.textContent = '⏳ جاري الإرسال...';
            statusMsg.style.display = 'block';

            const formData = new FormData(form);
            try {
                const response = await fetch(`https://formspree.io/f/${FORM_ID}`, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });
                if (response.ok) {
                    statusMsg.className = 'message success';
                    statusMsg.textContent = '✅ تم الإرسال بنجاح! شكراً لك.';
                    form.reset();
                } else {
                    throw new Error('فشل الإرسال');
                }
            } catch (error) {
                statusMsg.className = 'message error';
                statusMsg.textContent = '❌ حدث خطأ، حاول مرة أخرى.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 إرسال';
            }
        });
    </script>
</body>
</html>
