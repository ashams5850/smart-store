<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم الأدمن - Smart Store</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; padding: 30px 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .admin-container h1 { color: #1a1a2e; font-size: 30px; margin-bottom: 8px; }
        .admin-container h1 span { color: #46a0b2; }
        .admin-container .sub { color: #888; margin-bottom: 25px; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: #f8f9fa; padding: 18px 25px; border-radius: 14px; flex: 1; min-width: 150px; text-align: center; border-right: 5px solid #46a0b2; }
        .stat-card h3 { margin: 0; font-size: 14px; color: #888; }
        .stat-card p { margin: 8px 0 0; font-size: 26px; font-weight: bold; color: #1a1a2e; }
        .admin-container table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-container th { background: #46a0b2; color: white; padding: 12px; text-align: center; }
        .admin-container td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        .admin-container td img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #46a0b2; vertical-align: middle; }
        .btn { padding: 6px 16px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Tajawal', sans-serif; font-size: 14px; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-warning { background: #ffc107; color: #1a1a2e; }
        .btn-success { background: #28a745; color: white; }
        .links { margin-top: 25px; text-align: center; }
        .links a { color: #46a0b2; text-decoration: none; font-weight: bold; margin: 0 10px; }
        .toast { padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; display: none; font-weight: bold; text-align: center; }
        .toast-success { background: #d4edda; color: #155724; display: block; }
        .toast-error { background: #f8d7da; color: #721c24; display: block; }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>👑 <span>لوحة تحكم الأدمن</span></h1>
        <p class="sub">إدارة المستخدمين والصلاحيات</p>

        <div id="toastMessage" class="toast"></div>

        <div class="stats">
            <div class="stat-card"><h3>👤 عدد المستخدمين</h3><p id="usersCount">0</p></div>
            <div class="stat-card"><h3>👑 عدد الأدمن</h3><p id="adminsCount">0</p></div>
        </div>

        <h3>📋 قائمة المستخدمين</h3>
        <div id="usersList"><p class="loading">جاري تحميل المستخدمين...</p></div>

        <div class="links">
            <a href="dashboard.html">⬅ العودة للوحة التحكم</a>
            <a href="index.html">🏠 الرئيسية</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqOyFk7cauFKQw6h__E78LkSCiBHkgJSE",
            authDomain: "smart-store-bc1e6.firebaseapp.com",
            projectId: "smart-store-bc1e6",
            storageBucket: "smart-store-bc1e6.firebasestorage.app",
            messagingSenderId: "10224365969",
            appId: "1:10224365969:web:2a2d0de608d0b7d329ea30",
            measurementId: "G-ZW2P5Y8CPE"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showToast(msg, type = 'success') {
            const el = document.getElementById('toastMessage');
            el.textContent = msg;
            el.className = 'toast toast-' + type;
            el.style.display = 'block';
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        auth.onAuthStateChanged(async user => {
            if (!user) { window.location.href = 'login.html'; return; }
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists || doc.data().role !== 'admin') {
                    showToast('❌ ليس لديك صلاحيات الأدمن!', 'error');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                    return;
                }
                loadUsers();
            } catch (err) {
                showToast('❌ خطأ: ' + err.message, 'error');
            }
        });

        function loadUsers() {
            db.collection('users').get().then(snapshot => {
                let html = `<table><tr><th>البريد الإلكتروني</th><th>الدور</th><th>إجراءات</th></tr>`;
                let usersCount = 0, adminsCount = 0;
                if (snapshot.empty) {
                    html += `<tr><td colspan="3">لا يوجد مستخدمين</td></tr>`;
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const role = data.role || 'user';
                        usersCount++;
                        if (role === 'admin') adminsCount++;
                        html += `<tr>
                            <td>${data.email || 'غير معروف'}</td>
                            <td>${role === 'admin' ? '👑 أدمن' : '👤 مستخدم'}</td>
                            <td>
                                ${role !== 'admin' ? `<button class="btn btn-warning" onclick="makeAdmin('${doc.id}')">⭐ ترقية</button>` : ''}
                                ${role !== 'admin' ? `<button class="btn btn-danger" onclick="deleteUser('${doc.id}')">🗑️ حذف</button>` : ''}
                            </td>
                        </tr>`;
                    });
                }
                html += `</table>`;
                document.getElementById('usersList').innerHTML = html;
                document.getElementById('usersCount').textContent = usersCount;
                document.getElementById('adminsCount').textContent = adminsCount;
            }).catch(err => {
                document.getElementById('usersList').innerHTML = `<p class="loading">❌ خطأ: ${err.message}</p>`;
            });
        }

        function deleteUser(uid) {
            if (confirm('⚠️ هل أنت متأكد من حذف هذا المستخدم؟')) {
                db.collection('users').doc(uid).delete()
                    .then(() => { showToast('✅ تم الحذف', 'success'); loadUsers(); })
                    .catch(err => showToast('❌ خطأ: ' + err.message, 'error'));
            }
        }

        function makeAdmin(uid) {
            if (confirm('⭐ ترقية هذا المستخدم لأدمن؟')) {
                db.collection('users').doc(uid).update({ role: 'admin' })
                    .then(() => { showToast('✅ تمت الترقية', 'success'); loadUsers(); })
                    .catch(err => showToast('❌ خطأ: ' + err.message, 'error'));
            }
        }
    </script>
</body>
</html>
