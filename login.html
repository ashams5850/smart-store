<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Smart Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Tajawal', sans-serif; }
        .login-container { background: white; padding: 40px 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; color: #1a1a2e; margin-bottom: 10px; font-size: 28px; }
        .login-container h2 span { color: #46a0b2; }
        .login-container p.sub { text-align: center; color: #888; margin-bottom: 25px; }
        .login-container input { width: 100%; padding: 14px 15px; margin-bottom: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
        .login-container input:focus { border-color: #46a0b2; outline: none; box-shadow: 0 0 0 4px rgba(70,160,178,0.1); }
        .login-container button { width: 100%; padding: 15px; background: #46a0b2; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-container button:hover { background: #3a8a9a; transform: scale(1.02); }
        .login-container .links { text-align: center; margin-top: 20px; }
        .login-container .links a { color: #46a0b2; text-decoration: none; font-weight: bold; }
        .login-container .links a:hover { text-decoration: underline; }
        .login-container .error-msg, .login-container .success-msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; display: none; }
        .error-msg { background: #f8d7da; color: #721c24; }
        .success-msg { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 <span>تسجيل الدخول</span></h2>
        <p class="sub">أهلاً بك مجدداً في Smart Store</p>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        
        <input type="email" id="loginEmail" placeholder="📧 البريد الإلكتروني">
        <input type="password" id="loginPassword" placeholder="🔑 كلمة المرور">
        
        <button onclick="loginUser()">🚀 دخول</button>
        <div class="links">ليس لديك حساب؟ <a href="signup.html">سجل الآن</a></div>
        <div class="links"><a href="index.html">⬅ العودة للرئيسية</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDqOyFk7cauFKQw6h__E78LkSCiBHkgJSE",
            authDomain: "smart-store-bc1e6.firebaseapp.com",
            projectId: "smart-store-bc1e6",
            storageBucket: "smart-store-bc1e6.firebasestorage.app",
            messagingSenderId: "10224365969",
            appId: "1:10224365969:web:2a2d0de608d0b7d329ea30",
            measurementId: "G-ZW2P5Y8CPE"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function showError(msg) { 
            const el = document.getElementById('errorMsg'); 
            el.textContent = msg; 
            el.style.display = 'block'; 
            setTimeout(() => el.style.display = 'none', 5000); 
        }
        function showSuccess(msg) { 
            const el = document.getElementById('successMsg'); 
            el.textContent = msg; 
            el.style.display = 'block'; 
            setTimeout(() => el.style.display = 'none', 3000); 
        }

        function loginUser() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) {
                showError('❌ الرجاء ملء جميع الحقول');
                return;
            }
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    showSuccess('✅ تم تسجيل الدخول بنجاح!');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                })
                .catch(err => showError('❌ ' + err.message));
        }
    </script>
</body>
</html>
